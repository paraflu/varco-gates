name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    # Oracle e' ARM: runner ARM nativo, niente QEMU (better-sqlite3 crashava
    # sotto emulazione: "qemu: uncaught target signal 4", hang 6h -> timeout).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: paraflu
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/paraflu/varco-gates:latest
            ghcr.io/paraflu/varco-gates:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull + restart on Oracle via SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -i ~/.ssh/deploy_key"
          # Secrets in base64: attraversano l'heredoc SSH con qualsiasi carattere speciale.
          B64_ADMIN=$(printf '%s' "$ADMIN_PASSWORD" | base64 -w0)
          B64_TOKEN=$(printf '%s' "$HA_TOKEN" | base64 -w0)
          B64_URL=$(printf '%s' "$HA_BASE_URL" | base64 -w0)
          # Heredoc volutamente NON quotato: $B64_* espandono in locale,
          # \$(...) resta letterale e gira sul bash remoto (bypassa la login shell zsh
          # di Oracle, dove "export ... bash -s" moriva con "not valid in this context: -s").
          # shellcheck disable=SC2086
          ssh $SSH_OPTS paraflu@jlide.duckdns.org bash -s <<EOF
          set -e
          # Aggiorna SOLO docker-compose.yml (sorgente unica = repo),
          # .env resta locale sul server (mai toccato dal deploy).
          # Niente git clone: ~/varco-gates non è un repo, contiene solo
          # docker-compose.yml e .env; l'immagine viene già pushata su
          # GHCR dal job build-and-push, qui la scarichiamo e basta.
          curl -fsSL -o ~/varco-gates/docker-compose.yml \
            https://raw.githubusercontent.com/paraflu/varco-gates/main/docker-compose.yml
          cd ~/varco-gates
          # envsubst è opzionale (compose lo fa nativamente); qui passiamo
          # i secrets come env del comando, .env è solo fallback locale.
          export ADMIN_PASSWORD="\$(printf '%s' '$B64_ADMIN' | base64 -d)"
          export HA_TOKEN="\$(printf '%s' '$B64_TOKEN' | base64 -d)"
          export HA_BASE_URL="\$(printf '%s' '$B64_URL' | base64 -d)"
          docker compose pull
          docker compose up -d
          sleep 8
          curl -s -o /dev/null -w "local http_code=%{http_code}\n" http://localhost:3099/ || true
          EOF
          rm -f ~/.ssh/deploy_key
