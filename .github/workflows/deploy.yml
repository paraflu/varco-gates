name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: paraflu
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/paraflu/varco-gates:latest
            ghcr.io/paraflu/varco-gates:${{ github.sha }}

      - name: Copy compose file to Oracle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: jlide.duckdns.org
          username: paraflu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: docker-compose.yml
          target: varco-gates

      - name: Deploy on Oracle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: jlide.duckdns.org
          username: paraflu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/varco-gates
            export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            export HA_TOKEN="${{ secrets.HA_TOKEN }}"
            export HA_BASE_URL="${{ secrets.HA_BASE_URL }}"
            docker compose pull
            docker compose up -d
            sleep 5
            curl -s -o /dev/null -w "local http_code=%{http_code}\n" http://localhost:3099/ || true

