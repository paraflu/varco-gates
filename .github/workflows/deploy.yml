name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: paraflu
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64, linux/amd64
          push: true
          tags: |
            ghcr.io/paraflu/varco-gates:latest
            ghcr.io/paraflu/varco-gates:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull + restart on Oracle via SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -i ~/.ssh/deploy_key \
            paraflu@jlide.duckdns.org \
            "export ADMIN_PASSWORD='$ADMIN_PASSWORD' HA_TOKEN='$HA_TOKEN' HA_BASE_URL='$HA_BASE_URL' bash -s" <<'REMOTE'
            set -e
            cd ~
            if [ ! -d varco-gates ]; then git clone https://github.com/paraflu/varco-gates.git; fi
            cd varco-gates
            git fetch origin && git checkout main && git pull --ff-only
            docker compose pull
            docker compose up -d
            sleep 8
            curl -s -o /dev/null -w "local http_code=%{http_code}\n" http://localhost:3099/ || true
          REMOTE

