name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Oracle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: jlide.duckdns.org
          username: paraflu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~
            if [ ! -d varco-gates ]; then git clone https://github.com/paraflu/varco-gates.git; fi
            cd varco-gates
            git fetch origin
            git checkout main
            git pull --ff-only
            export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            export HA_TOKEN="${{ secrets.HA_TOKEN }}"
            export HA_BASE_URL="${{ secrets.HA_BASE_URL }}"
            docker compose up -d --build
            sleep 8
            curl -s -o /dev/null -w "local http_code=%{http_code}\n" http://localhost:3099/ || true

